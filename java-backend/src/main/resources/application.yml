ml-service:
  # Overridable so the containerized backend can reach ml-service by its compose
  # service name; defaults to localhost for a plain `mvn spring-boot:run`.
  base-url: ${ML_SERVICE_BASE_URL:http://localhost:8000}

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/pantrydb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate 

ocr:
  api-url: "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent"
  api-key: "${OCR_API_KEY}"

usda:
  api-url: "https://api.nal.usda.gov/fdc/v1"
  api-key: "${USDA_API_KEY}"