services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pantrydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pantry_pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

volumes:
  pantry_pg_data: